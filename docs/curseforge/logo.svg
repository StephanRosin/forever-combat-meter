<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc930" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffc930" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="panel"><rect x="72" y="96" width="368" height="320" rx="14"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- the meter window -->
  <g filter="url(#shadow)">
    <rect x="64" y="88" width="384" height="336" rx="20" fill="url(#gold)"/>
    <rect x="72" y="96" width="368" height="320" rx="14" fill="#0d111a"/>
  </g>
  <g clip-path="url(#panel)">
    <!-- header with the quest-log glow and line -->
    <rect x="72" y="96" width="368" height="58" fill="url(#glow)"/>
    <rect x="72" y="153" width="368" height="3" fill="#c8961f" opacity="0.6"/>
    <!-- crossed swords in the header -->
    <g transform="translate(112 125)" stroke-linecap="round">
      <path d="M-16 -16 L16 16 M16 -16 L-16 16" stroke="#ffd35a" stroke-width="6"/>
      <path d="M-19 9 L-9 19 M19 9 L9 19" stroke="#c9a46a" stroke-width="6"/>
    </g>
    <!-- header buttons -->
    <circle cx="398" cy="125" r="11" fill="none" stroke="#9a9aa2" stroke-width="4"/>
    <rect x="356" y="119" width="18" height="14" rx="3" fill="#9a9aa2"/>
    <path d="M359 119 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#9a9aa2" stroke-width="3"/>

    <!-- bars: class colours, falling totals -->
    <g>
      <rect x="92" y="176" width="328" height="44" rx="4" fill="#3fc7eb"/>
      <rect x="92" y="230" width="270" height="44" rx="4" fill="#c69b6d"/>
      <rect x="92" y="284" width="214" height="44" rx="4" fill="#fff468"/>
      <rect x="92" y="338" width="150" height="44" rx="4" fill="#8788ee"/>
      <rect x="92" y="176" width="328" height="44" rx="4" fill="url(#sheen)"/>
      <rect x="92" y="230" width="270" height="44" rx="4" fill="url(#sheen)"/>
      <rect x="92" y="284" width="214" height="44" rx="4" fill="url(#sheen)"/>
      <rect x="92" y="338" width="150" height="44" rx="4" fill="url(#sheen)"/>
    </g>
    <!-- rank numbers -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#ffffff"
       stroke="#000" stroke-width="5" paint-order="stroke">
      <text x="104" y="208">1</text>
      <text x="104" y="262">2</text>
      <text x="104" y="316">3</text>
      <text x="104" y="370">4</text>
    </g>
  </g>
</svg>
